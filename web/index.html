<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129504;</text></svg>">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">LLM Dashboard</span>
      <span class="brand-host" id="brand-host"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="topbar-right">
      <div class="vitals" id="vitals" title="Host memory and GPU"></div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>
</div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
